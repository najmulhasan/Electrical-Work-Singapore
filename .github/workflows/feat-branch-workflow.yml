name: Feature Branch Workflow

on:
  push:
    branches:
      - 'feat/*'
  pull_request:
    branches:
      - 'feat/*'

jobs:
  lint-and-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            src/**/*.{ts,tsx,js,jsx}

      - name: Run lint on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Linting changed files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"
          npx eslint ${{ steps.changed-files.outputs.all_changed_files }} --max-warnings 0 || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=MD_NAZMUL_HASAN_Electrical-Work-Singapore
            -Dsonar.organization=md-nazmul-hasan

      - name: Create Pull Request to integration
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Automated PR from feature branch'
          title: 'Feature: Merge to integration'
          body: 'This is an automated pull request from a feature branch.'
          branch: ${{ github.ref_name }}
          base: integration
          delete-branch: false
