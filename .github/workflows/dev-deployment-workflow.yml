name: Dev Deployment Workflow

on:
  pull_request:
    branches:
      - dev
    types:
      - closed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev' && github.event.pull_request.head.ref == 'integration'
    
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.nextjs
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/electrical-works-sg:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/electrical-works-sg:latest
          load: true

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/electrical-works-sg:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push Docker image to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.nextjs
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/electrical-works-sg:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/electrical-works-sg:latest
          labels: |
            org.opencontainers.image.title=Electrical Works SG
            org.opencontainers.image.description=Next.js application for Electrical Works Singapore
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Image published
        run: |
          echo "✅ Docker image successfully pushed to Docker Hub"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/electrical-works-sg:${{ github.sha }}"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/electrical-works-sg:latest"
